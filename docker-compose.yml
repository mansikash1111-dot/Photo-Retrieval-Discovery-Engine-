version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: discovery_db
    environment:
      POSTGRES_USER: discovery
      POSTGRES_PASSWORD: discovery_password
      POSTGRES_DB: photo_discovery
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: discovery_backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://discovery:discovery_password@postgres:5432/photo_discovery
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    container_name: discovery_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
